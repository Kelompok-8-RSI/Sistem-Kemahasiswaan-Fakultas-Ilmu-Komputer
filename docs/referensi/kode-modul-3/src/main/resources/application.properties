spring.application.name=layanan-kemahasiswaan
server.port=8080

# Database MySQL 8 (skema dibuat manual dari database/schema.sql, sehingga ddl-auto=none)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:layanan_kemahasiswaan}?serverTimezone=Asia/Jakarta
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
# nama tabel dan kolom mengikuti DDL apa adanya (AkunPengguna, idPengguna, dst.)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jakarta

# NFR-SRS-15: sesi berakhir setelah 30 menit tidak aktif
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# NFR-SRS-05: ukuran maksimal tiap berkas lampiran 5 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Storage berkas lampiran (BerkasLampiran.pathFile)
app.upload-dir=${UPLOAD_DIR:./uploads}

spring.thymeleaf.cache=false

# Format tanggal Indonesia pada tampilan (Senin, 12 Okt 2026)
spring.web.locale=id_ID
spring.web.locale-resolver=fixed
