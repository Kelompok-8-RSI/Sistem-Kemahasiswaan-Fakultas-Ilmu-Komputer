spring.application.name=layanan-kemahasiswaan
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:layanan_kemahasiswaan}?serverTimezone=Asia/Jakarta
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jakarta

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

app.upload-dir=${UPLOAD_DIR:./uploads}

spring.thymeleaf.cache=false

spring.web.locale=id_ID
spring.web.locale-resolver=fixed
